<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>لوحة الطلبات — VISION collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    .order-card {
      background: var(--panel-bg, #0d1e3d);
      border: 1px solid var(--panel-border, #19356a);
      border-radius: var(--radius-md, 16px);
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }
    
    .order-card:hover {
      border-color: var(--accent, #4a7bff);
      box-shadow: 0 10px 28px rgba(74, 123, 255, 0.15);
    }
    
    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--panel-border, #19356a);
      flex-wrap: wrap;
      gap: 10px;
    }
    
    .order-header h3 {
      color: #ffffff;
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    
    .order-header small {
      color: var(--text-muted, #8fa8e0);
      font-size: 12px;
    }
    
    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }
    
    .status-pending {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.45);
    }
    
    .status-confirmed {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.45);
    }
    
    .status-shipped {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.45);
    }
    
    .status-delivered {
      background: rgba(156, 163, 175, 0.2);
      color: #e5e7eb;
      border: 1px solid rgba(156, 163, 175, 0.45);
    }
    
    .status-cancelled {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.45);
    }
    
    .order-info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
      background: var(--input-bg, #09162e);
      padding: 16px 18px;
      border-radius: 12px;
      border: 1px solid var(--panel-border, #19356a);
    }
    
    .order-info-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    
    .order-info-label {
      font-size: 12px;
      color: var(--text-muted, #8fa8e0);
      font-weight: 700;
    }
    
    .order-info-value {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      word-break: break-word;
    }
    
    .order-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      padding-top: 14px;
      border-top: 1px solid var(--panel-border, #19356a);
    }
    
    .order-actions select {
      background: var(--input-bg, #09162e);
      color: #ffffff;
      border: 1px solid var(--panel-border, #19356a);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }
    
    .order-actions select:focus {
      border-color: var(--accent, #4a7bff);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }
    
    .order-actions .btn-secondary {
      background: rgba(74, 123, 255, 0.15);
      color: #7097ff;
      border: 1px solid rgba(74, 123, 255, 0.35);
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    
    .order-actions .btn-secondary:hover {
      background: #4a7bff;
      color: #ffffff;
      transform: translateY(-1px);
    }
    
    .order-actions .btn-icon.danger {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #ef4444;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    
    .order-actions .btn-icon.danger:hover {
      background: #ef4444;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Admin Auth Lock Screen (Password: vis2000is) -->
  <div id="admin-auth-lock" class="admin-auth-overlay" style="display:none;">
    <div class="admin-auth-box">
      <div class="admin-auth-icon">🔒</div>
      <img src="images/logo.jpg" alt="VISION Logo" class="admin-auth-logo">
      <h2>منطقة الإدارة المحمية</h2>
      <p>يرجى إدخال كود الدخول الخاص بالتاجر للمتابعة</p>
      <form id="admin-auth-form" onsubmit="handleAdminLogin(event)">
        <div class="auth-input-group">
          <input type="password" id="admin-passcode" placeholder="أدخل الكود السري..." autocomplete="current-password" required>
          <button type="button" class="btn-toggle-pass" onclick="togglePasscodeVisibility()" title="إظهار/إخفاء الكود">👁️</button>
        </div>
        <p id="auth-error-msg" class="auth-error-msg"></p>
        <button type="submit" class="btn-auth-submit">دخول إلى لوحة الطلبات 🚀</button>
      </form>
    </div>
  </div>

  <div class="admin-container">
    
    <!-- Header -->
    <header class="admin-header">
      <div class="brand-section">
        <img src="images/logo.jpg" alt="VISION Logo" class="brand-logo">
        <div class="brand-title">
          <h1>VISION ORDERS</h1>
          <span>لوحة استقبال وإدارة طلبات الزبائن</span>
        </div>
      </div>
      <div class="header-actions">
        <span class="status-pill" id="orders-count-pill">إجمالي الطلبات: 0</span>
        <a href="index.html" class="btn-preview">
          <span>🏠</span> <span>العودة للمتجر</span>
        </a>
        <a href="admin.html" class="btn-preview">
          <span>⚙️</span> <span>لوحة التاجر</span>
        </a>
        <button type="button" class="btn-preview" onclick="adminLogout()" title="تسجيل الخروج">
          <span>🚪</span> <span>خروج</span>
        </button>
      </div>
    </header>

    <!-- Orders Content -->
    <main class="admin-grid">
      <section class="panel" style="grid-column: 1 / -1;">
        <div class="panel-title">
          <h2><span>📦</span> الطلبات الواردة</h2>
          <span class="badge-count" id="total-orders-count">0 طلب</span>
        </div>

        <!-- Filter Tabs -->
        <div style="display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;">
          <button class="btn-secondary" onclick="filterOrders('all')" style="padding: 8px 16px; font-size: 13px;">الكل</button>
          <button class="btn-secondary" onclick="filterOrders('pending')" style="padding: 8px 16px; font-size: 13px;">قيد الانتظار</button>
          <button class="btn-secondary" onclick="filterOrders('confirmed')" style="padding: 8px 16px; font-size: 13px;">مؤكد</button>
          <button class="btn-secondary" onclick="filterOrders('shipped')" style="padding: 8px 16px; font-size: 13px;">تم الشحن</button>
          <button class="btn-secondary" onclick="filterOrders('delivered')" style="padding: 8px 16px; font-size: 13px;">تم التوصيل</button>
          <button class="btn-secondary" onclick="filterOrders('cancelled')" style="padding: 8px 16px; font-size: 13px;">ملغى</button>
        </div>

        <div class="posts-list" id="orders-list">
          <div class="empty-state">
            <span>⏳</span>
            جاري تحميل الطلبات...
          </div>
        </div>
      </section>
    </main>

  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
